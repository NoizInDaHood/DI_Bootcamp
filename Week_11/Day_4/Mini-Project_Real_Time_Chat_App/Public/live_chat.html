<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Time Live Chat Room</title>
    <link rel="stylesheet" href="./live-chat.css">
</head>
<body>
    <main class="app-container">
        <section class="join-card">
            <h1>Real Time Live Chat Room</h1>
            <p class="subtitle">Choose your profile before joining a chat room.</p>

            <form class="join-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>

                <div class="form-group">
                    <label for="age">Age</label>
                    <input type="number" id="age" name="age" placeholder="Enter your age" min="1" required>
                </div>

                <div class="form-group">
                    <label for="gender">Gender</label>
                    <select id="gender" name="gender" required>
                        <option value="">Choose your gender</option>
                        <option value="male">Male</option>
                        <option value="female">Female</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="room">Chat Room</label>
                    <select id="room" name="room" required>
                        <option value="general">General</option>
                        <option value="gaming">Gaming</option>
                        <option value="tech">Tech</option>
                        <option value="random">Random</option>
                    </select>
                </div>

                <button type="submit">Join Chat</button>
            </form>
        </section>

        <section class="chat-room hidden">
            <aside class="users-panel">
                <h2>Active Users</h2>
                <ul class="users-list"></ul>
            </aside>

            <section class="chat-panel">
                <header class="chat-header">
                    <h2>Room: <span class="current-room">General</span></h2>
                    <button class="leave-btn" type="button">Leave Room</button>
                </header>

                <div class="messages"></div>

                <form class="message-form">
                    <input type="text" id="message" name="message" placeholder="Type your message..." autocomplete="off" required>
                    <button type="submit">Send</button>
                </form>
            </section>
        </section>
    </main>

    <script src="/socket.io/socket.io.js"></script>   
    <script src="client.js"></script>

</body>
</html>
