<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">
    <title>Drum Set</title>
    <link rel="stylesheet", href="drumset.css">
</head>
<body>
    <div class="container" id="container">
        <div class="square" id="boom">
         <p class="letter">A</p>
         <p class="sound">Boom</p>
        </div>        
        <div class="square" id="clap">
         <p class="letter">S</p>
         <p class="sound">Clap</p>
        </div>
        <div class="square" id="hihat">
         <p class="letter">D</p>
         <p class="sound">HiHat</p>
        </div>
        <div class="square" id="kick">
         <p class="letter">F</p>
         <p class="sound">Kick</p>
        </div>
        <div class="square" id="openhat">
         <p class="letter">G</p>
         <p class="sound">OpenHat</p>
        </div>
        <div class="square" id="ride">
         <p class="letter">H</p>
         <p class="sound">Ride</p>
        </div>
        <div class="square" id="snare">
         <p class="letter">J</p>
         <p class="sound">Snare</p>
        </div>
        <div class="square" id="tink">
         <p class="letter">K</p>
         <p class="sound">Tink</p>
        </div>
        <div class="square" id="tom">
         <p class="letter">L</p>
         <p class="sound">Tom</p>
        </div>
    </div>    
<script src= "drumset.js"></script>   
</body>
</html>
