<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To Do List</title>
    <link rel="stylesheet" href="to_do_list.css">
</head>
<body>
<div class="header">
<h1 class="title">TO DO LIST</h1>
</div>
<div class="container">

    <form class="form" id="form">
      <input class="input" id="input" type="text" placeholder="Type anything...">
      <button type="submit" id="btnAdd" class="add-btn">ADD</button>
    </form>
    <div class="container-list">
      <ul class="list" id="List"></ul>
      <button type="button" id="btnClear" class="clear-btn">CLEAR</button>


    </div>
</div>

<script src="to_do_list.js"></script>  
</body>
</html>
