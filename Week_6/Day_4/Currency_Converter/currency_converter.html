<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currecy Converter</title>
    <link rel="stylesheet" href="currency_converter.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Press+Start+2P&family=Zen+Dots&display=swap" rel="stylesheet"> 
</head>
<body>
    <div class="container" id="container">
        <h1 class="title">Currency Converter</h1>
        <p class="result" id="result">1,200.45 EUR</p>
        <p class="result2" id="result2">1,150.45 USD</p>
        <form class="form" id="form">
            <label class="label">From</label>
            <select class="select" id="selectCurrencyFrom">

            </select>
            <label class="label">To</label>
            <select class="select" id="selectCurrencyTo">

            </select>
            <label class="label">Amount</label>
            <div class="containerAmount">
              <input type="number" class="inputAmount" id="inputAmount" placeholder="Amount">
              <button type="submit" class="btnSubmit" id="btnSubmit">CONVERT</button>
            </div>
        </form>
    </div>





    <script src="currency_converter.js"></script>
</body>
</html>
