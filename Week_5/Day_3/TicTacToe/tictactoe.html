<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="tictactoe.css" >
</head>
<body>
    <main class="main" id="main">
        <p class="title" id="title" >Tic Tac Toe</p>
        <div class="instructions" id="instructions">
            <p class="textInstruc" id="textInstruc">Choose which one to play with</p>
            <button type="button" class="buttonX" id="buttonX">X</button>
            <button type="button" class="buttonO" id="buttonO">O</button>
            <button type="button" class="btnMode" id="btnMode">Enable difficulty</button>
        </div>
        
    </main>
    <section class="container" id="container">
        <div class="tictactoe" id="tictactoe">
            <div class="case" id="1"></div>
            <div class="case" id="2"></div>
            <div class="case" id="3"></div>
            <div class="case" id="4"></div>
            <div class="case" id="5"></div>
            <div class="case" id="6"></div>
            <div class="case" id="7"></div>
            <div class="case" id="8"></div>
            <div class="case" id="9"></div>
        </div>
        <div class="end" id="end">
            <h1 class="resultTitle" id="resultTitle">IT'S A DRAW !!!</h1>
            <p>Party is over. Would you like to replay?</p>
            <button type="button" class="btnYes" id="btnYes">YES</button>
        </div>
    </section>



    <script src="tictactoe.js"></script>
</body>
</html>
